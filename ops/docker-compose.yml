# Reference observability + data plane. NOT exercised in the authoring environment (no docker); validate before use.
services:
  redis:   { image: "redis:7" }
  otel-collector: { image: "otel/opentelemetry-collector-contrib:0.104.0", command: ["--config=/etc/otel.yaml"], volumes: ["./otel-collector.yaml:/etc/otel.yaml"], ports: ["4317:4317"] }
  tempo:   { image: "grafana/tempo:2.5.0" }
  prometheus: { image: "prom/prometheus:v2.53.0", volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml", "./alerts.yml:/etc/prometheus/alerts.yml"], ports: ["9090:9090"] }
  grafana: { image: "grafana/grafana:11.1.0", ports: ["3000:3000"] }
  nginx:   { image: "nginx:1.27", volumes: ["./nginx.conf:/etc/nginx/nginx.conf"], ports: ["80:80"] }
