name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/build_vault.py && python -m core.graphify build ./core ./knowledge_vault --output graph.json && python -m core.manifest
      - run: python -m pytest -q tests
      - run: python -m eval.run_kpis     # exits non-zero on any FAIL; NOT_MEASURED (KPI 31-36) does not fail CI
